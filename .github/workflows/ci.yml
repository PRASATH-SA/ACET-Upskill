name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.24
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Build web
        run: npm run build -w @acet/web

  # H1: every core journey in a real browser, with the scripted mock LLM.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.24
      - run: npm ci
      - run: npm run e2e:install
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # H1: backup → disaster → restore with the production scripts and MongoDB auth setup.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/backup/test-backup-restore.sh
      - name: Production compose file is valid
        run: |
          cp deploy/.env.prod.example .env.ci
          sed -i 's/^\(JWT_[A-Z_]*SECRET\|MONGO_[A-Z_]*PASSWORD\)=.*/\1=ci0123456789abcdef/' .env.ci
          docker compose --env-file .env.ci -f docker-compose.prod.yml config --quiet
